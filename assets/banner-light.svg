<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agentwatch — bring all your agent activity into one place" font-family="'SF Mono','Menlo','Consolas',monospace">
  <rect width="1280" height="400" fill="#eff1f5"/>

  <!-- wordmark and tagline -->
  <text x="96" y="168" font-size="64" font-weight="600" fill="#4c4f69">agent<tspan fill="#8839ef">watch</tspan></text>
  <text x="99" y="208" font-size="17" letter-spacing="2.2" fill="#6c6f85">BRING ALL YOUR AGENT ACTIVITY INTO ONE PLACE</text>

  <!-- tmux status line: session chip, then one entry per agent -->
  <rect x="64" y="272" width="1152" height="48" rx="10" fill="#e6e9ef" stroke="#ccd0da"/>
  <rect x="76" y="282" width="92" height="28" rx="6" fill="#8839ef"/>
  <text x="122" y="301" font-size="15" font-weight="600" fill="#eff1f5" text-anchor="middle">my-app</text>
  <g font-size="16">
    <text x="190" y="302"><tspan fill="#1e66f5">●</tspan><tspan fill="#4c4f69" dx="8">Fix checkout redirect</tspan></text>
    <text x="452" y="302" fill="#ccd0da">│</text>
    <text x="478" y="302"><tspan fill="#fe640b">⏸</tspan><tspan fill="#4c4f69" dx="8">Tune API rate limits</tspan></text>
    <text x="730" y="302" fill="#ccd0da">│</text>
    <text x="756" y="302"><tspan fill="#df8e1d">!</tspan><tspan fill="#6c6f85" dx="8">Upgrade infra</tspan></text>
    <text x="924" y="302" fill="#ccd0da">│</text>
    <text x="950" y="302"><tspan fill="#40a02b">✓</tspan><tspan fill="#6c6f85" dx="8">Refresh docs</tspan></text>
    <text x="1196" y="302" fill="#9ca0b0" text-anchor="end">+3</text>
  </g>

  <text x="1216" y="356" font-size="14" fill="#9ca0b0" text-anchor="end">pi · claude code · codex</text>
</svg>
