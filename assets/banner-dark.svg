<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agentwatch — bring all your agent activity into one place" font-family="'SF Mono','Menlo','Consolas',monospace">
  <rect width="1280" height="400" fill="#1e1e2e"/>

  <!-- wordmark and tagline -->
  <text x="96" y="168" font-size="64" font-weight="600" fill="#cdd6f4">agent<tspan fill="#cba6f7">watch</tspan></text>
  <text x="99" y="208" font-size="17" letter-spacing="2.2" fill="#a6adc8">BRING ALL YOUR AGENT ACTIVITY INTO ONE PLACE</text>

  <!-- tmux status line: session chip, then one entry per agent -->
  <rect x="64" y="272" width="1152" height="48" rx="10" fill="#181825" stroke="#313244"/>
  <rect x="76" y="282" width="92" height="28" rx="6" fill="#cba6f7"/>
  <text x="122" y="301" font-size="15" font-weight="600" fill="#11111b" text-anchor="middle">my-app</text>
  <g font-size="16">
    <text x="190" y="302"><tspan fill="#89b4fa">●</tspan><tspan fill="#cdd6f4" dx="8">Fix checkout redirect</tspan></text>
    <text x="452" y="302" fill="#313244">│</text>
    <text x="478" y="302"><tspan fill="#fab387">⏸</tspan><tspan fill="#cdd6f4" dx="8">Tune API rate limits</tspan></text>
    <text x="730" y="302" fill="#313244">│</text>
    <text x="756" y="302"><tspan fill="#f9e2af">!</tspan><tspan fill="#a6adc8" dx="8">Upgrade infra</tspan></text>
    <text x="924" y="302" fill="#313244">│</text>
    <text x="950" y="302"><tspan fill="#a6e3a1">✓</tspan><tspan fill="#a6adc8" dx="8">Refresh docs</tspan></text>
    <text x="1196" y="302" fill="#6c7086" text-anchor="end">+3</text>
  </g>

  <text x="1216" y="356" font-size="14" fill="#6c7086" text-anchor="end">pi · claude code · codex</text>
</svg>
