<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pi-overwatch — one status line for every session">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14171C"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="55%">
      <stop offset="0" stop-color="#45C4B0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#45C4B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#45C4B0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#45C4B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E0A83E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E0A83E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <circle cx="1280" cy="0" r="520" fill="none" stroke="#45C4B0" stroke-width="1" opacity="0.05"/>
  <circle cx="1280" cy="0" r="380" fill="none" stroke="#45C4B0" stroke-width="1" opacity="0.06"/>

  <!-- session status rows -->
  <g font-family="'SF Mono','Menlo','Consolas',monospace">
    <circle cx="110" cy="132" r="12" fill="url(#dotGlow)"/>
    <circle cx="110" cy="132" r="6" fill="#45C4B0"/>
    <text x="140" y="138" font-size="19" fill="#E6E8EA">web</text>
    <text x="410" y="138" font-size="15" fill="#5B6472" text-anchor="end">2s</text>

    <circle cx="110" cy="186" r="12" fill="url(#warnGlow)"/>
    <circle cx="110" cy="186" r="6" fill="#E0A83E"/>
    <circle cx="110" cy="186" r="10" fill="none" stroke="#E0A83E" stroke-width="1.2" opacity="0.6"/>
    <text x="140" y="192" font-size="19" fill="#E6E8EA">api</text>
    <text x="410" y="192" font-size="15" fill="#E0A83E" text-anchor="end">waiting</text>

    <circle cx="110" cy="240" r="6" fill="none" stroke="#5B6472" stroke-width="1.5"/>
    <text x="140" y="246" font-size="19" fill="#8791A0">infra</text>
    <text x="410" y="246" font-size="15" fill="#5B6472" text-anchor="end">stale</text>

    <circle cx="110" cy="294" r="6" fill="#5B6472"/>
    <path d="M106.5,294.3 L109,297.3 L114,289.8" fill="none" stroke="#E6E8EA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="300" font-size="19" fill="#E6E8EA">docs</text>
    <text x="410" y="300" font-size="15" fill="#5B6472" text-anchor="end">done</text>
  </g>

  <!-- wordmark -->
  <text x="470" y="196" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="56" font-weight="600" fill="#E6E8EA" letter-spacing="0.5">pi<tspan fill="#45C4B0">-overwatch</tspan></text>

  <!-- tagline -->
  <text x="472" y="230" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="17" letter-spacing="2.2" fill="#7C8592">ONE STATUS LINE FOR EVERY SESSION</text>

  <!-- footer -->
  <text x="1160" y="368" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="16" fill="#3A4048">pi install npm:pi-overwatch</text>
</svg>
