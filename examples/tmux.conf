# Overwatch status row — requires pi-overwatch on tmux's PATH.
# Source this AFTER your status-bar theme/plugin configuration.
# Keeps status-format[0] (your main bar) unchanged, but owns the second row.
# If you already use multiple rows, adapt the index and status count first.

set -g status 2
set -g status-format[1] "#[align=left]  #(pi-overwatch statusline)"

# Keep the existing status-interval. For a five-second refresh, opt in:
# set -g status-interval 5

# Source glyphs distinguish Pi from Claude Code. For a quieter row, append
# --no-source to the statusline command. Use --max 3 for narrower terminals.
# Colors inherit the tmux background and follow the configured tmux palette.

# Optional dashboard bindings — uncomment only if these keys are free.
# Normal split: keep working alongside the dashboard.
# bind o split-window -h -l 65% "pi-overwatch"
# Modal popup (tmux >= 3.2): press q to close.
# bind O display-popup -E -w 85% -h 70% "pi-overwatch"
# True floating pane (tmux >= 3.7), as an alternative to the split:
# bind o new-pane "pi-overwatch"
